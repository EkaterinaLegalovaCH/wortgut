[project]
name = "wortgut"
version = "0.1.0"
description = "Local-first German reading app: paste a text, tap unknown words, get offline translations, keep your own word list."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "spacy>=3.8",
    # German model: pinned wheel so `uv sync` installs it and never prunes it.
    "de-core-news-sm",
]

[tool.uv.sources]
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
